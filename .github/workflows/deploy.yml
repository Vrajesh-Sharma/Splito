name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Check Vercel authentication
        run: vercel whoami --token="$VERCEL_TOKEN"

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Check Supabase environment variables
        run: |
          echo "Checking Vercel environment variables..."

          if [ -f .vercel/.env.production.local ]; then
            echo ".vercel/.env.production.local exists"

            if grep -q '^VITE_SUPABASE_URL=' .vercel/.env.production.local; then
              echo "VITE_SUPABASE_URL=<present>"
            else
              echo "VITE_SUPABASE_URL=<MISSING>"
            fi

            if grep -q '^VITE_SUPABASE_ANON_KEY=' .vercel/.env.production.local; then
              echo "VITE_SUPABASE_ANON_KEY=<present>"
            else
              echo "VITE_SUPABASE_ANON_KEY=<MISSING>"
            fi
          else
            echo ".vercel/.env.production.local NOT FOUND"
            exit 1
          fi

      - name: Validate Supabase URL
        run: |
          URL=$(grep '^VITE_SUPABASE_URL=' .vercel/.env.production.local | cut -d '=' -f2-)

          echo "URL length: ${#URL}"

          if [[ "$URL" =~ ^https:// ]]; then
            echo "URL starts with https://"
          elif [[ "$URL" =~ ^http:// ]]; then
            echo "URL starts with http://"
          else
            echo "ERROR: URL does NOT start with http:// or https://"
            exit 1
          fi

          node -e "const u = new URL(process.argv[1]); console.log('Valid URL:', u.origin)" "$URL"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
